<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <meta author="Julius">
        <meta description="Sito random">
        <link rel="stylesheet" href="../static/css/style.css">
        <title>Log In</title>
    </head>
    <body style="text-align: center; align-items: center;">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <ul>
                    {% for category, message in messages %}
                        <li class="{{ category }}">{{ message }}</li>
                    {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}
        <h1>Log In Page</h1>
        <form action="{{ url_for('login') }}" method="post">
            <input type="email" placeholder="E-Mail" name="email"><br>
            <input type="password" placeholder="Password (max. 50 characters)" name="password"><br>
            <input type="submit" value="Log In"><br>
            <a href="{{ url_for('signup') }}"><h2>Don't have an account? Sign-up</h2></a>
        </form>
    </body>
</html>
